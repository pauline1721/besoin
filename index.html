<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>UNIS</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#efe3cf}button{font:inherit}
#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#efe3cf}

.porte{position:absolute;top:27%;width:17.5%;height:55%;padding:0;border:0;background:transparent;cursor:pointer;perspective:1800px;-webkit-tap-highlight-color:transparent}
.porte1{left:15%}.porte2{left:41.25%}.porte3{left:67.5%}
.portail{position:absolute;inset:0;z-index:2;overflow:hidden;opacity:0;background:radial-gradient(ellipse at 50% 48%,#fff 0%,#fff 34%,#fffdf3 55%,#fff4c9 77%,#fff 100%);border-radius:50% 50% 2% 2%/22% 22% 2% 2%;box-shadow:inset 0 0 45px #fff,0 0 45px #fff,0 0 110px #fff,0 0 180px rgba(255,235,160,.96);transition:opacity .35s ease}
.porte.ouverte .portail{opacity:1}

.battant canvas{width:100%;height:100%;display:block;border-radius:50% 50% 2% 2%/22% 22% 2% 2%;backface-visibility:hidden}
.porte.ouverte .battant{transform:perspective(1800px) rotateY(78deg);filter:brightness(.82)}
#starfield{position:fixed;inset:0;z-index:24;pointer-events:none;overflow:hidden;opacity:0;transition:opacity .35s ease}

.star{position:absolute;left:50%;top:50%;color:#d7a43c;text-shadow:0 0 5px #fff,0 0 12px #ffe39a,0 0 24px #ffc24a;opacity:0;transform:translate(-50%,-50%) scale(.2);will-change:transform,opacity}
.star.run{animation:traverse var(--d) linear var(--delay) forwards}
@keyframes traverse{0%{opacity:0;transform:translate(calc(-50% + var(--sx)),calc(-50% + var(--sy))) scale(.15)}8%{opacity:.9}22%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--ex)),calc(-50% + var(--ey))) scale(var(--scale))}}
#scene.entree{animation:avancer 3.8s cubic-bezier(.28,.01,.07,1) forwards}
@keyframes avancer{from{transform:scale(1);filter:blur(0)}to{transform:scale(6.4);filter:blur(1.3px)}}

<body>
<div id="viewport">
<div id="scene">
<img id="portesImage" src="portes.png" alt="Les trois portes UNIS">
<button class="porte porte1" data-x="23.75" data-y="54" data-image="souffler.png" aria-label="J’ai besoin de souffler"><div class="portail"></div><div class="battant"><canvas></canvas></div></button>
<button class="porte porte2" data-x="50" data-y="54" data-image="douceur.png" aria-label="J’ai besoin de douceur"><div class="portail"></div><div class="battant"><canvas></canvas></div></button>
<button class="porte porte3" data-x="76.25" data-y="54" data-image="avancer.png" aria-label="J’ai besoin d’avancer"><div class="portail"></div><div class="battant"><canvas></canvas></div></button>
</div>
</div>
<div id="starfield"></div>
<div id="flash"></div>
<div id="destination"><img id="imageDestination" src="" alt=""><button id="retour">Revenir aux portes</button></div>
<audio id="carillon" preload="auto" playsinline><source src="carillon.m4a" type="audio/mp4"></audio>
<script>
const scene=document.getElementById("scene"),imagePrincipale=document.getElementById("portesImage"),portes=document.querySelectorAll(".porte"),starfield=document.getElementById("starfield"),flash=document.getElementById("flash"),destination=document.getElementById("destination"),imageDestination=document.getElementById("imageDestination"),retour=document.getElementById("retour"),carillon=document.getElementById("carillon");let animationEnCours=false;
function creerBattants(){const W=imagePrincipale.naturalWidth,H=imagePrincipale.naturalHeight;if(!W||!H)return;portes.forEach(porte=>{const canvas=porte.querySelector("canvas"),ctx=canvas.getContext("2d"),gauche=porte.classList.contains("porte1")?15:porte.classList.contains("porte2")?41.25:67.5,haut=27,largeur=17.5,hauteur=55,sx=W*gauche/100,sy=H*haut/100,sw=W*largeur/100,sh=H*hauteur/100;canvas.width=Math.round(sw);canvas.height=Math.round(sh);ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(imagePrincipale,sx,sy,sw,sh,0,0,canvas.width,canvas.height)})}
if(imagePrincipale.complete)creerBattants();else imagePrincipale.addEventListener("load",creerBattants);
function creerTunnelEtoiles(porte){
starfield.innerHTML="";
const r=porte.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height*.52;
for(let i=0;i<220;i++){
const a=Math.random()*Math.PI*2,departR=Math.random()*Math.max(r.width*.42,18),sx=Math.cos(a)*departR,sy=Math.sin(a)*departR*.75,distance=Math.max(innerWidth,innerHeight)*(0.65+Math.random()*1.1),ex=Math.cos(a)*distance,ey=Math.sin(a)*distance,s=document.createElement("span");
s.className="star";
s.textContent="★";
s.style.left=cx+"px";
s.style.top=cy+"px";
s.style.fontSize=(10+Math.random()*18)+"px";
s.style.setProperty("--sx",sx+"px");
s.style.setProperty("--sy",sy+"px");
s.style.setProperty("--ex",ex+"px");
s.style.setProperty("--ey",ey+"px");
s.style.setProperty("--scale",(1.8+Math.random()*3.7));
s.style.setProperty("--d",(1.4+Math.random()*2.7)+"s");
s.style.setProperty("--delay",(Math.random()*1.8)+"s");
starfield.appendChild(s)
}
starfield.classList.add("visible");
requestAnimationFrame(()=>document.querySelectorAll(".star").forEach(s=>s.classList.add("run")))
}
function ouvrirPorte(porte){
if(animationEnCours)return;
animationEnCours=true;
imageDestination.src=porte.dataset.image;
scene.style.transformOrigin=porte.dataset.x+"% "+porte.dataset.y+"%";
try{carillon.currentTime=0;const p=carillon.play();if(p)p.catch(()=>{})}catch(e){}
porte.classList.add("ouverte");
setTimeout(()=>creerTunnelEtoiles(porte),250);
setTimeout(()=>scene.classList.add("entree"),650);
setTimeout(()=>flash.classList.add("actif"),2900);
setTimeout(()=>destination.classList.add("visible"),3900)
}
portes.forEach(porte=>porte.addEventListener("click",()=>ouvrirPorte(porte)));
retour.addEventListener("click",()=>{
destination.classList.remove("visible");
flash.classList.remove("actif");
starfield.classList.remove("visible");
starfield.innerHTML="";
scene.classList.remove("entree");
portes.forEach(porte=>porte.classList.remove("ouverte"));
scene.style.transformOrigin="50% 50%";
try{carillon.pause();carillon.currentTime=0}catch(e){}
setTimeout(()=>{imageDestination.src="";animationEnCours=false},850)
});
</script>
</body>
</html>
