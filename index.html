<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,viewport-fit=cover">
<title>UNIS</title>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#efe3cf}
#viewport{position:fixed;inset:0;display:flex;justify-content:center;align-items:center;overflow:hidden;background:#efe3cf}
#scene{position:relative;width:min(100vw,150vh);aspect-ratio:3/2;flex-shrink:0;transform-origin:50% 50%}
#portesImage{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none;user-select:none}
.porte{position:absolute;top:27%;width:17.5%;height:55%;border:0;padding:0;background:transparent;cursor:pointer;perspective:1400px;-webkit-tap-highlight-color:transparent}
.porte1{left:15%}.porte2{left:41.25%}.porte3{left:67.5%}
.portail{position:absolute;inset:1%;background:radial-gradient(ellipse at center,#fff 0%,#fffef8 35%,#fff5d8 65%,#fff 100%);opacity:0;box-shadow:0 0 25px #fff,0 0 60px #fff,0 0 120px #fff7d6;transition:opacity .5s ease;z-index:1}
.porte.ouverte .portail{opacity:1}
.battant{position:absolute;inset:0;z-index:3;transform-origin:left center;transform-style:preserve-3d;transition:transform 1.25s cubic-bezier(.18,.72,.12,1),filter 1s ease}
.battant canvas{width:100%;height:100%;display:block}
.porte.ouverte .battant{transform:rotateY(-83deg);filter:brightness(1.08)}
#scene.entree{animation:entrerDansLaPorte 1.7s cubic-bezier(.22,.04,.12,1) forwards}
@keyframes entrerDansLaPorte{0%{transform:scale(1);filter:blur(0)}35%{transform:scale(1.18);filter:blur(0)}65%{transform:scale(1.8);filter:blur(.5px)}100%{transform:scale(3.8);filter:blur(3px)}}
#flash{position:fixed;inset:0;z-index:30;background:#fff;opacity:0;pointer-events:none}
#flash.actif{animation:flashBlanc 1.35s ease forwards}
@keyframes flashBlanc{0%{opacity:0}30%{opacity:.1}55%{opacity:.45}78%{opacity:.92}100%{opacity:1}}
#destination{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:#fff;opacity:0;pointer-events:none;transition:opacity 1s ease}
#destination.visible{opacity:1;pointer-events:auto}
#imageDestination{width:100%;height:100%;object-fit:contain;display:block}
#retour{position:absolute;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);padding:11px 20px;border:1px solid rgba(142,105,55,.45);border-radius:30px;background:rgba(255,255,255,.75);backdrop-filter:blur(8px);color:#6d4d2c;font-family:Arial,sans-serif;font-size:11px;letter-spacing:.13em;text-transform:uppercase;cursor:pointer}
@media(orientation:portrait){#scene{width:100vw;height:auto}}
@media(orientation:landscape){#scene{height:100vh;width:auto}}
</style>
</head>
<body>
<div id="viewport">
<div id="scene">
<img id="portesImage" src="portes.png" alt="Les trois portes UNIS">
<button class="porte porte1" data-x="23.75" data-y="54" data-image="souffler.png" aria-label="J’ai besoin de souffler"><div class="portail"></div><div class="battant"><canvas></canvas></div></button>
<button class="porte porte2" data-x="50" data-y="54" data-image="douceur.png" aria-label="J’ai besoin de douceur"><div class="portail"></div><div class="battant"><canvas></canvas></div></button>
<button class="porte porte3" data-x="76.25" data-y="54" data-image="avancer.png" aria-label="J’ai besoin d’avancer"><div class="portail"></div><div class="battant"><canvas></canvas></div></button>
</div>
</div>
<div id="flash"></div>
<div id="destination"><img id="imageDestination" src="" alt=""><button id="retour">Revenir aux portes</button></div>
<audio id="carillon" preload="auto" playsinline><source src="carillon.m4a" type="audio/mp4"></audio>
<script>
const scene=document.getElementById("scene"),imagePrincipale=document.getElementById("portesImage"),portes=document.querySelectorAll(".porte"),flash=document.getElementById("flash"),destination=document.getElementById("destination"),imageDestination=document.getElementById("imageDestination"),retour=document.getElementById("retour"),carillon=document.getElementById("carillon");let animationEnCours=false;
function creerBattants(){const largeurImage=imagePrincipale.naturalWidth,hauteurImage=imagePrincipale.naturalHeight;if(!largeurImage||!hauteurImage)return;portes.forEach(porte=>{const canvas=porte.querySelector("canvas"),ctx=canvas.getContext("2d");let gauche=porte.classList.contains("porte1")?15:porte.classList.contains("porte2")?41.25:67.5;const haut=27,largeur=17.5,hauteur=55,sourceX=largeurImage*gauche/100,sourceY=hauteurImage*haut/100,sourceLargeur=largeurImage*largeur/100,sourceHauteur=hauteurImage*hauteur/100;canvas.width=Math.round(sourceLargeur);canvas.height=Math.round(sourceHauteur);ctx.drawImage(imagePrincipale,sourceX,sourceY,sourceLargeur,sourceHauteur,0,0,canvas.width,canvas.height)})}
if(imagePrincipale.complete)creerBattants();else imagePrincipale.addEventListener("load",creerBattants);
function ouvrirPorte(porte){if(animationEnCours)return;animationEnCours=true;imageDestination.src=porte.dataset.image;scene.style.transformOrigin=porte.dataset.x+"% "+porte.dataset.y+"%";try{carillon.currentTime=0;const lecture=carillon.play();if(lecture)lecture.catch(()=>{})}catch(e){}porte.classList.add("ouverte");setTimeout(()=>scene.classList.add("entree"),700);setTimeout(()=>flash.classList.add("actif"),1200);setTimeout(()=>destination.classList.add("visible"),2350)}
portes.forEach(porte=>porte.addEventListener("click",()=>ouvrirPorte(porte)));
retour.addEventListener("click",()=>{destination.classList.remove("visible");flash.classList.remove("actif");scene.classList.remove("entree");portes.forEach(porte=>porte.classList.remove("ouverte"));scene.style.transformOrigin="50% 50%";try{carillon.pause();carillon.currentTime=0}catch(e){}setTimeout(()=>{imageDestination.src="";animationEnCours=false},800)});
</script>
</body>
</html>
