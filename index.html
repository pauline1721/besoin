<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>UNIS</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#efe3cf}button{font:inherit}
#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#efe3cf}
#scene{position:relative;width:min(100vw,150vh);aspect-ratio:3/2;flex-shrink:0;transform-origin:50% 50%;will-change:transform,filter}
#portesImage{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;pointer-events:none;user-select:none}
.porte{position:absolute;top:27%;width:17.5%;height:55%;padding:0;border:0;background:transparent;cursor:pointer;perspective:1800px;-webkit-tap-highlight-color:transparent}
.porte1{left:15%}.porte2{left:41.25%}.porte3{left:67.5%}
.portail{position:absolute;inset:0;z-index:2;overflow:hidden;opacity:0;background:radial-gradient(ellipse at 50% 48%,#fff 0%,#fff 36%,#fffdf3 57%,#fff6d8 76%,#fff 100%);border-radius:50% 50% 2% 2%/22% 22% 2% 2%;box-shadow:inset 0 0 35px #fff,0 0 35px #fff,0 0 90px #fff,0 0 150px rgba(255,236,170,.95);transition:opacity .35s ease}
.porte.ouverte .portail{opacity:1}
.battant{position:absolute;inset:0;z-index:4;transform-origin:left center;transform-style:preserve-3d;backface-visibility:hidden;transition:transform 1.3s cubic-bezier(.18,.72,.12,1),filter 1s ease}
.battant canvas{width:100%;height:100%;display:block;border-radius:50% 50% 2% 2%/22% 22% 2% 2%;backface-visibility:hidden}
.porte.ouverte .battant{transform:perspective(1800px) rotateY(78deg);filter:brightness(.82)}
#doorGlow{position:fixed;z-index:25;pointer-events:none;opacity:0;transition:opacity .45s ease}
#doorGlow.visible{opacity:1}
#doorGlow.fade{opacity:0}
.glowStar{position:absolute;color:#d9aa48;text-shadow:0 0 5px #fff,0 0 11px #ffe8a5,0 0 20px #ffd36c;transform:translate(-50%,-50%);opacity:0;animation:brille 1.25s ease-in-out infinite}
@keyframes brille{0%,100%{opacity:.15;transform:translate(-50%,-50%) scale(.45) rotate(0deg)}45%{opacity:1;transform:translate(-50%,-50%) scale(1.25) rotate(50deg)}70%{opacity:.7;transform:translate(-50%,-50%) scale(.85) rotate(85deg)}}
#scene.entree{animation:avancer 3s cubic-bezier(.32,.01,.08,1) forwards}
@keyframes avancer{from{transform:scale(1);filter:blur(0)}to{transform:scale(5.6);filter:blur(1.5px)}}
#flash{position:fixed;inset:0;z-index:30;background:#fff;opacity:0;pointer-events:none}
#flash.actif{animation:flashBlanc 1.2s ease forwards}
@keyframes flashBlanc{0%{opacity:0}30%{opacity:.08}60%{opacity:.38}82%{opacity:.88}100%{opacity:1}}
#destination{position:fixed;inset:0;z-index:40;background:#fff;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .7s ease}
#destination.visible{opacity:1;pointer-events:auto}
#imageDestination{width:100%;height:100%;object-fit:contain;display:block}
#retour{position:absolute;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);padding:11px 20px;border:1px solid rgba(142,105,55,.45);border-radius:30px;background:rgba(255,255,255,.82);backdrop-filter:blur(8px);color:#6d4d2c;font:11px Arial,sans-serif;letter-spacing:.13em;text-transform:uppercase;cursor:pointer}
@media(orientation:portrait){#scene{width:100vw;height:auto}}@media(orientation:landscape){#scene{height:100vh;width:auto}}
</style>
</head>
<body>

<div id="viewport">
<div id="scene">

<img id="portesImage" src="portes.png" alt="Les trois portes UNIS">

<button class="porte porte1" data-x="23.75" data-y="54" data-image="souffler.png" aria-label="J’ai besoin de souffler">
<div class="portail"></div>
<div class="battant"><canvas></canvas></div>
</button>

<button class="porte porte2" data-x="50" data-y="54" data-image="douceur.png" aria-label="J’ai besoin de douceur">
<div class="portail"></div>
<div class="battant"><canvas></canvas></div>
</button>

<button class="porte porte3" data-x="76.25" data-y="54" data-image="avancer.png" aria-label="J’ai besoin d’avancer">
<div class="portail"></div>
<div class="battant"><canvas></canvas></div>
</button>

</div>
</div>

<div id="doorGlow"></div>
<div id="flash"></div>

<div id="destination">
<img id="imageDestination" src="" alt="">
<button id="retour">Revenir aux portes</button>
</div>

<audio id="carillon" preload="auto" playsinline>
<source src="carillon.m4a" type="audio/mp4">
</audio>

<script>
const scene=document.getElementById("scene"),imagePrincipale=document.getElementById("portesImage"),portes=document.querySelectorAll(".porte"),doorGlow=document.getElementById("doorGlow"),flash=document.getElementById("flash"),destination=document.getElementById("destination"),imageDestination=document.getElementById("imageDestination"),retour=document.getElementById("retour"),carillon=document.getElementById("carillon");let animationEnCours=false;

function creerBattants(){
const W=imagePrincipale.naturalWidth,H=imagePrincipale.naturalHeight;
if(!W||!H)return;
portes.forEach(porte=>{
const canvas=porte.querySelector("canvas"),ctx=canvas.getContext("2d");
const gauche=porte.classList.contains("porte1")?15:porte.classList.contains("porte2")?41.25:67.5;
const haut=27,largeur=17.5,hauteur=55,sx=W*gauche/100,sy=H*haut/100,sw=W*largeur/100,sh=H*hauteur/100;
canvas.width=Math.round(sw);canvas.height=Math.round(sh);
ctx.clearRect(0,0,canvas.width,canvas.height);
ctx.drawImage(imagePrincipale,sx,sy,sw,sh,0,0,canvas.width,canvas.height);
});
}

if(imagePrincipale.complete)creerBattants();else imagePrincipale.addEventListener("load",creerBattants);

function creerEtoilesAutour(porte){
doorGlow.innerHTML="";
doorGlow.className="";
const r=porte.getBoundingClientRect();
const marge=12;
doorGlow.style.left=(r.left-marge)+"px";
doorGlow.style.top=(r.top-marge)+"px";
doorGlow.style.width=(r.width+marge*2)+"px";
doorGlow.style.height=(r.height+marge*2)+"px";

const W=r.width+marge*2,H=r.height+marge*2;
const points=[];

/* côté gauche */
for(let i=0;i<10;i++){
points.push([4,H*.25+(H*.72/9)*i]);
}

/* côté droit */
for(let i=0;i<10;i++){
points.push([W-4,H*.25+(H*.72/9)*i]);
}

/* arche supérieure */
for(let i=0;i<16;i++){
const angle=Math.PI+(Math.PI*i/15);
const cx=W/2;
const cy=H*.24;
const rx=W*.48;
const ry=H*.22;
points.push([cx+Math.cos(angle)*rx,cy+Math.sin(angle)*ry]);
}

points.forEach((p,i)=>{
const s=document.createElement("span");
s.className="glowStar";
s.textContent=i%3===0?"✦":"✧";
s.style.left=p[0]+"px";
s.style.top=p[1]+"px";
s.style.fontSize=(8+Math.random()*11)+"px";
s.style.animationDelay=(Math.random()*1.1)+"s";
doorGlow.appendChild(s);
});

doorGlow.classList.add("visible");
}

function ouvrirPorte(porte){
if(animationEnCours)return;
animationEnCours=true;

imageDestination.src=porte.dataset.image;
scene.style.transformOrigin=porte.dataset.x+"% "+porte.dataset.y+"%";

creerEtoilesAutour(porte);

try{
carillon.currentTime=0;
const p=carillon.play();
if(p)p.catch(()=>{});
}catch(e){}

porte.classList.add("ouverte");

/* Les étoiles restent autour de la porte pendant l'ouverture */
setTimeout(()=>scene.classList.add("entree"),900);

/* Elles disparaissent avant que le zoom ne puisse les déformer */
setTimeout(()=>doorGlow.classList.add("fade"),1350);

/* La lumière prend progressivement tout l'écran */
setTimeout(()=>flash.classList.add("actif"),2350);

/* Puis l'image finale apparaît */
setTimeout(()=>destination.classList.add("visible"),3250);
}

portes.forEach(porte=>porte.addEventListener("click",()=>ouvrirPorte(porte)));

retour.addEventListener("click",()=>{
destination.classList.remove("visible");
flash.classList.remove("actif");
doorGlow.className="";
doorGlow.innerHTML="";
scene.classList.remove("entree");
portes.forEach(porte=>porte.classList.remove("ouverte"));
scene.style.transformOrigin="50% 50%";
try{carillon.pause();carillon.currentTime=0}catch(e){}
setTimeout(()=>{
imageDestination.src="";
animationEnCours=false;
},850);
});
</script>

</body>
</html>
