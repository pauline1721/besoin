<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>UNIS</title>

<style>

/* =========================
   PAGE
========================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #efe1c8;
}

body {
    font-family: Georgia, "Times New Roman", serif;
}


/* =========================
   IMAGE DES PORTES
========================= */

.scene {

    position: fixed;
    inset: 0;

    background-image: url("portes.png");
    background-position: center center;
    background-repeat: no-repeat;
    background-size: cover;

    overflow: hidden;

    transform-origin: center center;
}


/* =========================
   ZONES CLIQUABLES
========================= */

.porte {

    position: absolute;

    top: 27%;

    width: 18%;
    height: 55%;

    border: none;
    background: transparent;

    cursor: pointer;

    padding: 0;

    perspective: 1200px;

    -webkit-tap-highlight-color: transparent;
}


/* Porte gauche */

.porte1 {
    left: 14.5%;
}


/* Porte milieu */

.porte2 {
    left: 41%;
}


/* Porte droite */

.porte3 {
    left: 67.5%;
}


/* =========================
   ÉLÉMENT QUI SIMULE
   L'OUVERTURE
========================= */

.battant {

    position: absolute;
    inset: 0;

    transform-origin: left center;

    transform-style: preserve-3d;

    transition:
        transform 1.1s
        cubic-bezier(.2,.7,.15,1);
}


/* ouverture */

.porte.ouverte .battant {

    transform: rotateY(-82deg);
}


/* =========================
   EFFET D'ENTRÉE
========================= */

.scene.entree {

    animation:
        avancer 1.8s
        cubic-bezier(.25,.05,.15,1)
        forwards;
}


@keyframes avancer {

    0% {
        transform: scale(1);
    }

    45% {
        transform: scale(1.35);
    }

    75% {
        transform: scale(1.9);
    }

    100% {
        transform: scale(2.8);
        filter: blur(2px);
    }
}


/* =========================
   LUMIÈRE BLANCHE
========================= */

.lumiere {

    position: fixed;

    inset: 0;

    background: white;

    opacity: 0;

    pointer-events: none;

    z-index: 20;
}


.lumiere.active {

    animation:
        flashBlanc 2s
        ease
        forwards;
}


@keyframes flashBlanc {

    0% {
        opacity: 0;
    }

    35% {
        opacity: 0.15;
    }

    60% {
        opacity: 0.55;
    }

    80% {
        opacity: 0.92;
    }

    100% {
        opacity: 1;
    }
}


/* =========================
   ÉCRAN DU MESSAGE
========================= */

.ecran-message {

    position: fixed;

    inset: 0;

    z-index: 30;

    background: white;

    display: flex;

    justify-content: center;
    align-items: center;

    padding: 35px;

    opacity: 0;

    pointer-events: none;

    transition:
        opacity 1s ease;
}


.ecran-message.visible {

    opacity: 1;

    pointer-events: auto;
}


/* =========================
   MESSAGE
========================= */

.contenu {

    width: min(700px, 92vw);

    text-align: center;

    color: #4c3825;

    opacity: 0;

    transform:
        translateY(20px);
}


.ecran-message.visible .contenu {

    animation:
        apparitionMessage
        1.4s
        ease
        0.3s
        forwards;
}


@keyframes apparitionMessage {

    from {

        opacity: 0;

        transform:
            translateY(20px);
    }

    to {

        opacity: 1;

        transform:
            translateY(0);
    }
}


.message {

    font-size:
        clamp(24px, 5vw, 43px);

    line-height: 1.4;

    font-weight: normal;

    margin: 0;
}


/* =========================
   PETIT SYMBOLE UNIS
   SUR L'ÉCRAN FINAL
========================= */

.symbole {

    margin-bottom: 35px;

    display: flex;

    justify-content: center;

    align-items: center;
}


.anneaux {

    position: relative;

    width: 110px;

    height: 65px;
}


.anneau {

    position: absolute;

    top: 5px;

    width: 55px;

    height: 55px;

    border: 3px solid #b98a3e;

    border-radius: 50%;
}


.anneau.gauche {

    left: 10px;
}


.anneau.droite {

    right: 10px;
}


.etoile {

    position: absolute;

    left: 50%;

    top: 50%;

    transform:
        translate(-50%,-50%);

    color: #b98a3e;

    font-size: 25px;

    z-index: 3;
}


/* =========================
   BOUTON RETOUR
========================= */

.retour {

    margin-top: 45px;

    padding: 12px 25px;

    border:

        1px solid
        rgba(170,122,53,.55);

    border-radius: 30px;

    background:
        rgba(239,225,200,.3);

    color: #79572c;

    font-family:
        Arial,
        sans-serif;

    font-size: 12px;

    letter-spacing: .15em;

    text-transform: uppercase;

    cursor: pointer;
}


/* =========================
   MOBILE
========================= */

@media
(max-width: 700px) {

    .scene {

        background-size:
            auto 100%;

        background-position:
            center center;
    }


    .porte {

        top: 27%;

        height: 55%;

        width: 21%;
    }


    .porte1 {

        left: 10%;
    }


    .porte2 {

        left: 39.5%;
    }


    .porte3 {

        left: 69%;
    }

}


/* =========================
   ACCESSIBILITÉ
========================= */

@media
(prefers-reduced-motion: reduce) {

    .scene.entree {

        animation-duration:
            0.3s;
    }

    .lumiere.active {

        animation-duration:
            0.5s;
    }

}

</style>

</head>


<body>


<!-- =========================
     IMAGE PRINCIPALE
========================= -->

<div
id="scene"
class="scene">


<!-- PORTE 1 -->

<button
class="porte porte1"
data-message="Tu n’as rien à résoudre maintenant. Respire. Quelques secondes peuvent suffire pour retrouver un peu d’espace."
aria-label="J’ai besoin de souffler">

<div class="battant"></div>

</button>


<!-- PORTE 2 -->

<button
class="porte porte2"
data-message="Tu mérites aussi la douceur que tu offres aux autres. Aujourd’hui, parle-toi comme tu parlerais à quelqu’un que tu aimes."
aria-label="J’ai besoin de douceur">

<div class="battant"></div>

</button>


<!-- PORTE 3 -->

<button
class="porte porte3"
data-message="Tu n’as pas besoin de voir tout le chemin. Un seul pas suffit. Puis un autre. Et aujourd’hui, ce premier pas compte déjà."
aria-label="J’ai besoin d’avancer">

<div class="battant"></div>

</button>


</div>


<!-- =========================
     FLASH BLANC
========================= -->

<div
id="lumiere"
class="lumiere">
</div>


<!-- =========================
     MESSAGE FINAL
========================= -->

<div
id="ecranMessage"
class="ecran-message">

<div class="contenu">


<!-- LOGO SIMPLE -->

<div class="symbole">

<div class="anneaux">

<div
class="anneau gauche">
</div>

<div
class="anneau droite">
</div>

<div class="etoile">
★
</div>

</div>

</div>


<p
id="message"
class="message">
</p>


<button
id="retour"
class="retour">

Revenir aux portes

</button>


</div>

</div>


<!-- =========================
     CARILLON
========================= -->

<audio
id="carillon"
preload="auto"
playsinline>

<source
src="carillon.m4a"
type="audio/mp4">

</audio>


<!-- =========================
     JAVASCRIPT
========================= -->

<script>


const scene =
document.getElementById("scene");


const lumiere =
document.getElementById("lumiere");


const ecranMessage =
document.getElementById("ecranMessage");


const message =
document.getElementById("message");


const carillon =
document.getElementById("carillon");


const portes =
document.querySelectorAll(".porte");


const retour =
document.getElementById("retour");


let animationEnCours = false;


/* =========================
   CLIC SUR UNE PORTE
========================= */

function entrerDansPorte(porte) {


    if(animationEnCours) {

        return;
    }


    animationEnCours = true;


    /* -------------------------
       CARILLON
    ------------------------- */

    try {

        carillon.currentTime = 0;

        const lecture =
        carillon.play();


        if(lecture) {

            lecture.catch(
                () => {}
            );
        }

    }

    catch(erreur) {

    }


    /* -------------------------
       OUVERTURE PORTE
    ------------------------- */

    porte.classList.add(
        "ouverte"
    );


    /* -------------------------
       AVANCÉE VERS LA PORTE
    ------------------------- */

    setTimeout(

        () => {

            scene.classList.add(
                "entree"
            );

        },

        250

    );


    /* -------------------------
       LUMIÈRE BLANCHE
    ------------------------- */

    setTimeout(

        () => {

            lumiere.classList.add(
                "active"
            );

        },

        700

    );


    /* -------------------------
       AFFICHAGE MESSAGE
    ------------------------- */

    setTimeout(

        () => {

            message.textContent =
                porte.dataset.message;


            ecranMessage.classList.add(
                "visible"
            );

        },

        2300

    );

}


/* =========================
   ACTIVER LES 3 PORTES
========================= */

portes.forEach(

    porte => {

        porte.addEventListener(

            "click",

            () => {

                entrerDansPorte(
                    porte
                );

            }

        );

    }

);


/* =========================
   RETOUR AUX PORTES
========================= */

retour.addEventListener(

    "click",

    () => {


        ecranMessage.classList.remove(
            "visible"
        );


        lumiere.classList.remove(
            "active"
        );


        scene.classList.remove(
            "entree"
        );


        portes.forEach(

            porte => {

                porte.classList.remove(
                    "ouverte"
                );

            }

        );


        try {

            carillon.pause();

            carillon.currentTime = 0;

        }

        catch(erreur) {

        }


        setTimeout(

            () => {

                animationEnCours =
                    false;

            },

            700

        );

    }

);


</script>


</body>

</html>
